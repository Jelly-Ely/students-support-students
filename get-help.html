<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Ask Students Support Students for peer guidance and help finding your next step."><title>Find Support | Students Support Students</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/get-help.css"></head><body><header class="site-header"></header><main><section class="page-hero"><div class="page-hero-content container"><p class="section-label">Find Support</p><h1>Tell us what you're figuring out.</h1><p>You don't need to have the perfect question. Share what's going on and we'll help point you toward a student, resource, or useful next step.</p></div></section><section class="section"><div class="container"><form class="admin-form" id="support-request-form"><div class="form-grid"><div class="form-group"><label for="first_name">First Name</label><input type="text" id="first_name" name="first_name" required></div><div class="form-group"><label for="last_name">Last Name</label><input type="text" id="last_name" name="last_name" required></div><div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div><div class="form-group"><label for="school">School</label><input type="text" id="school" name="school" required></div><div class="form-group"><label for="grade_level">Where are you in school?</label><select id="grade_level" name="grade_level" required><option value="">Choose one</option><option>High School</option><option>Community College</option><option>University</option><option>Graduate School</option></select></div><div class="form-group"><label for="topic">What are you navigating?</label><select id="topic" name="topic" required><option value="">Choose one</option><option>College Applications</option><option>Scholarships</option><option>Financial Aid</option><option>Transfer</option><option>Career Advice</option><option>Choosing a Major</option><option>Campus Life</option><option>I'm Not Sure Yet</option><option>Other</option></select></div></div><div class="form-group"><label for="message">Tell us a little more</label><textarea id="message" name="message" rows="7" placeholder="What's on your mind?" required></textarea></div><button class="button button-primary" type="submit">Send my request →</button><p class="static-form-note">Form delivery is still being connected. For now, submitting this form will not send your information.</p></form></div></section></main><footer class="site-footer"></footer><script src="js/script.js"></script><script src="js/static-forms.js"></script></body></html>
